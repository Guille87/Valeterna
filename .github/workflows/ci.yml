name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs superados en PRs; en main se dejan terminar (el job del badge commitea).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # El grueso corre en Linux (rápido y barato) sobre todas las versiones
    # soportadas; un único job en Windows cubre la rama de msvcrt y pygame en
    # Windows, que es donde se distribuye el .exe.
    runs-on: ${{ matrix.os }}
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Tests + cobertura
        run: pytest --cov=valeterna --cov-report=xml --cov-report=term-missing

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pyright
        run: pyright

  # Check único y estable para la protección de rama: agrega el resultado de la
  # matriz de 'test' (y de 'types') en un solo estado. Si la matriz cambia, esto
  # no se rompe.
  all-green:
    if: always()
    needs: [test, types]
    runs-on: ubuntu-latest
    steps:
      - name: test y types deben haber pasado
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test = ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.types.result }}" != "success" ]; then
            echo "types = ${{ needs.types.result }}"
            exit 1
          fi

  coverage-badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Medir cobertura
        run: pytest --cov=valeterna --cov-report=xml -q

      - name: Publicar el badge en la rama 'badges'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          genbadge coverage -i coverage.xml -o coverage.svg
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch badges "$url" badges-repo
          cp coverage.svg badges-repo/coverage.svg
          cd badges-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet && { echo "El badge no ha cambiado."; exit 0; }
          git commit -m "chore: actualiza el badge de cobertura"
          git push origin badges
