name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Generar config/secrets.py (si hay secretos configurados)
        env:
          CRASH_WEBHOOK_URL: ${{ secrets.CRASH_WEBHOOK_URL }}
          CRASH_MENTION_USER_ID: ${{ secrets.CRASH_MENTION_USER_ID }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: python .github/scripts/write_secrets.py

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Construir el ejecutable
        run: pyinstaller Valeterna.spec

      - name: Empaquetar
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "Valeterna-$tag-windows.zip"
          Compress-Archive -Path dist/Valeterna -DestinationPath $zip
          # SHA256SUMS: lo verifica el auto-updater antes de aplicar una actualización.
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $zip" | Set-Content -Encoding ascii SHA256SUMS

      - name: Publicar en el GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Valeterna-*-windows.zip
            SHA256SUMS
          generate_release_notes: true
